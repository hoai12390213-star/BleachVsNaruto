name: iOS AIR dev build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  ios-dev-build:
    runs-on: macos-14
    timeout-minutes: 60

    env:
      FLEX_HOME: ${{ github.workspace }}/sdk/flex4.16.1-air51.0.1.1
      IOS_SHELL_DIR: ${{ github.workspace }}/SHELL_Ios
      APP_ENTRY: ${{ github.workspace }}/SHELL_Ios/src/FighterTesterIOS.as
      FLEX_CFG: ${{ github.workspace }}/SHELL_Ios/flex-config.xml
      APP_XML: ${{ github.workspace }}/SHELL_Ios/src/FighterTester-app.xml
      ADT_PACKAGE_TARGET: ipa-debug

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install extraction tools
        run: |
          brew install p7zip

      - name: Download Flex/AIR SDK
        run: |
          mkdir -p sdk
          cd sdk
          curl -L "https://github.com/5DPLAY-Game-Studio/BleachVsNaruto_FlexSDK/releases/download/flex4.16.1-air51.0.1.1/flex4.16.1-air51.0.1.1.rar" -o flexsdk.rar
          7z x flexsdk.rar -y
          ls -la

      - name: Decode signing files
        if: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' && secrets.APPLE_PROVISIONING_PROFILE_BASE64 != '' }}
        run: |
          echo "${{ secrets.APPLE_CERTIFICATE_BASE64 }}" | base64 --decode > Certificate.p12
          echo "${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > profile.mobileprovision
          echo "APPLE_CERTIFICATE_PATH=${{ github.workspace }}/Certificate.p12" >> $GITHUB_ENV
          echo "APPLE_PROVISIONING_PROFILE_PATH=${{ github.workspace }}/profile.mobileprovision" >> $GITHUB_ENV
          echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" >> $GITHUB_ENV

      - name: Make build script executable
        run: chmod +x tools/script/build_ios.sh

      - name: Execute iOS personal build
        run: |
          export PATH="$FLEX_HOME/bin:$PATH"
          export APPLE_CERTIFICATE_PATH="${APPLE_CERTIFICATE_PATH:-}"
          export APPLE_CERTIFICATE_PASSWORD="${APPLE_CERTIFICATE_PASSWORD:-}"
          export APPLE_PROVISIONING_PROFILE_PATH="${APPLE_PROVISIONING_PROFILE_PATH:-}"
          tools/script/build_ios.sh

      - name: Upload personal IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bleachvsnaruto-ios-ipa
          path: |
            build/*.ipa
            out/
          if-no-files-found: warn

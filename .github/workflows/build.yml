name: Build BVN iOS IPA

on:
  workflow_dispatch:
    inputs:
      apk_release:
        description: 'Tag of the GitHub Release that has the input.apk asset (leave empty to use a committed file at build/input.apk)'
        required: false
        default: ''

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install python deps
        run: pip3 install --quiet asn1crypto 2>/dev/null || true

      - name: Print environment
        run: |
          uname -a
          xcodebuild -version 2>/dev/null | head -1
          which adt sips || true

      - name: Fetch AIR SDK (compiler-only)
        run: bash scripts/fetch_sdk.sh "${{ github.workspace }}/.cache/airsdk"

      - name: Obtain input APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          if [ -n "${{ github.event.inputs.apk_release }}" ]; then
            gh release download "${{ github.event.inputs.apk_release }}" \
              --pattern '*.apk' --dir build --clobber || true
          fi
          APK="$(ls build/*.apk 2>/dev/null | head -1 || true)"
          if [ -z "${APK}" ] && [ -f build/input.apk ]; then
            APK="build/input.apk"
          fi
          if [ -z "${APK}" ]; then
            echo "::error::No APK found. Add an APK to a GitHub Release as asset, or commit it at build/input.apk"
            exit 1
          fi
          echo "APK=${GITHUB_WORKSPACE}/${APK}" >> "$GITHUB_ENV"

      - name: Build IPA
        id: build
        env:
          SDK_DIR: "${{ github.workspace }}/.cache/airsdk/sdk"
          APK: "${{ env.APK }}"
          OUT_DIR: "${{ github.workspace }}/dist"
        run: bash scripts/build_ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BVN-iOS
          path: dist/BVN.ipa
          if-no-files-found: error